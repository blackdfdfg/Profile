<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing you in… — Fix X Agent</title>
<meta name="robots" content="noindex"><link rel="icon" href="/agent/assets/favicon.png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07060d;color:#e9e7f2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
.s{width:34px;height:34px;border:3px solid rgba(167,139,250,.25);border-top-color:#a78bfa;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 16px}@keyframes r{to{transform:rotate(360deg)}}
a{color:#c4b5fd}p{color:#9a97ab}</style></head>
<body><div><div class="s" id="sp"></div><h2 id="t">Signing you in with Google…</h2><p id="m">Please wait a moment.</p></div>
<script>
(async () => {
  const API = "https://fixasif-premium.fixasif.workers.dev";
  const q = new URLSearchParams(location.search);
  const fail = (msg) => { document.getElementById("sp").remove(); document.getElementById("t").textContent = "Sign-in failed"; document.getElementById("m").innerHTML = msg + '<br><br><a href="/agent/">Back to Fix X Agent</a>'; };
  const code = q.get("code"), state = q.get("state");
  const st = sessionStorage.getItem("fxa_g_state"), ver = sessionStorage.getItem("fxa_g_verifier");
  const ret = sessionStorage.getItem("fxa_g_return") || "#/dashboard";
  sessionStorage.removeItem("fxa_g_state"); sessionStorage.removeItem("fxa_g_verifier"); sessionStorage.removeItem("fxa_g_return");
  if (q.get("error")) return fail("Google sign-in was cancelled.");
  if (!code || !state || !st || state !== st || !ver) return fail("This sign-in link is invalid or expired. Please try again.");
  try {
    const r = await fetch(API + "/auth/google/exchange", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, codeVerifier: ver }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.token) return fail((d.message || "Could not sign you in.").replace(/</g, "&lt;"));
    localStorage.setItem("fxa_token", d.token);
    location.replace("/agent/" + (ret.startsWith("#") ? ret : "#/dashboard"));
  } catch (e) { fail("Network error — please try again."); }
})();
</script></body></html>
